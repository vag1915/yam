<title>Jeu de Yam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Un écran noir plein cadre, comme Farkle : engrenage à gauche, scores à droite, piste ronde verte entre le gobelet et le panneau STOP. Cinq dés à garder, puis une fiche de marque à choisir au clavier. Tout le texte est en Arial gras, blanc sur noir. L'élément actif est entouré de jaune. */
:root {
  --noir: #000;
  --blanc: #fff;
  --rouge: #a50c1a;
  --rouge2: #a50c1a;
  --vert: #1aa84a;
  --piste: #14793b;
  --rail: #0a4a22;
  --focus: #ffe600;
  --police: Arial, Helvetica, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--noir);
  color: var(--blanc);
  font: 700 18px/1.45 var(--police);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: 700 18px var(--police); color: var(--blanc); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nav:focus { outline: 6px solid var(--focus); outline-offset: 3px; }
.nav:focus:not(:focus-visible) { outline: 6px solid var(--focus); outline-offset: 3px; }
body.sans-cadre .nav:focus { outline: none; }
.saisie { width: 100%; font: 700 20px var(--police); color: var(--blanc); background: var(--noir); border: 3px solid var(--blanc); border-radius: 12px; padding: 12px 18px; min-height: 58px; }

.ecran { height: 100%; max-width: 900px; margin: 0 auto; background: var(--noir); display: flex; flex-direction: column; overflow: hidden; }
.vue { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.centre { align-items: center; justify-content: center; padding: 16px; }
.haut { flex: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 4px; }
.scores { font-size: 15px; text-align: right; line-height: 1.5; min-width: 0; flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ligne-score { padding: 1px 6px; border-radius: 6px; cursor: pointer; }
.scores.bat { flex-direction: row; align-items: stretch; justify-content: space-around; gap: 6px; text-align: center; }
.scores.bat .ligne-score { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; border: 2px solid #777; border-radius: 10px; padding: 1px 3px; }
.scores.bat .sn { font-size: 13px; overflow-wrap: anywhere; line-height: 1.1; }
.scores.bat .ss { font-size: 20px; line-height: 1.05; }
.scores.bat .ligne-score.actif { border-color: #fff; }
.scores.bat .ligne-score.elim { opacity: 0.4; text-decoration: line-through; }
.scores.cible .ligne-score:not(.elim) { border-color: var(--rouge); border-width: 4px; }
.engrenage { background: none; border: 0; padding: 4px; width: 56px; height: 56px; border-radius: 10px; flex: none; }
.engrenage svg { width: 100%; height: 100%; display: block; }

.gros { background: radial-gradient(ellipse at 50% 18%, #ff8f8f 0%, #d90012 48%, #8f000d 100%); color: var(--blanc); border: 0; border-radius: 50%; padding: 52px 28px; width: min(100%, 420px); font-size: clamp(24px, 6vw, 34px); letter-spacing: 0.03em; box-shadow: 0 9px 0 #5a0008, 0 16px 20px rgba(0, 0, 0, 0.8), inset 0 5px 8px rgba(255, 255, 255, 0.5), inset 0 -8px 12px rgba(0, 0, 40, 0.45); transition: transform 0.08s, box-shadow 0.08s; }
.gros:active { transform: translateY(6px); box-shadow: 0 3px 0 #5a0008, 0 6px 8px rgba(0, 0, 0, 0.8), inset 0 5px 8px rgba(255, 255, 255, 0.5), inset 0 -8px 12px rgba(0, 0, 40, 0.45); }
.gros small { display: block; font-size: 16px; letter-spacing: 0; font-weight: 700; margin-top: 2px; }
.menu { display: flex; flex-direction: column; gap: 16px; align-items: center; width: 100%; }
.gros:active { filter: brightness(1.25); }

#v-partie { padding-bottom: 8px; }
.jeu { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.dessus { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.grille-box { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 10px; }
.infos { text-align: center; padding: 0 12px; }
.tour { font-size: 18px; }
.score-tour { font-size: 26px; line-height: 1.1; display: inline-block; padding: 0 14px; border-radius: 8px; }
.rail { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "piste piste" "gobelet valider"; gap: 8px 16px; justify-items: center; width: 100%; padding: 0 8px; }
.piste { grid-area: piste; position: relative; width: min(100%, max(150px, calc(100vh - 230px))); width: min(100%, max(150px, calc(100dvh - 230px))); aspect-ratio: 1 / 1; border: 7px solid var(--rail); border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #1b9248 0%, var(--piste) 55%, #0e5a2b 100%); box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.55); }
#gobelet { grid-area: gobelet; }
#valider { grid-area: valider; background: #000; }
.zone { position: absolute; inset: 0; }
.ico { background: none; border: 0; padding: 0; width: 72px; height: 72px; flex: none; border-radius: 14px; }
.ico svg { width: 100%; height: 100%; display: block; }
#valider svg { filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.8)); transition: transform 0.08s; }
#valider:active svg { transform: translateY(3px) scale(0.97); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.8)); }
.message { min-height: 26px; text-align: center; font-size: 19px; padding: 0 12px; }

.de { position: absolute; left: 0; top: 0; width: var(--sz, 40px); height: var(--sz, 40px); background: var(--noir); border: 2px solid #555; border-radius: 18%; padding: 0; display: block; appearance: none; transition: transform 0.17s ease-out; cursor: pointer; }
.de svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.de.kept { background: #8a0f1c; border-color: #c0505c; }
.de.joker { background: #8a0f1c; border-color: var(--blanc); animation: clignote 0.9s ease-in-out infinite; }
@keyframes clignote { 0%, 100% { box-shadow: 0 0 0 4px #fff, 0 0 16px 6px #fff; } 50% { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1); } }
.de.off { display: none; }
.de:focus { outline-offset: 5px; }
.dspec { position: absolute; left: 50%; top: 50%; width: 38%; aspect-ratio: 1; transform: translate(-50%, -50%); background: #000; border: 3px solid #fff; border-radius: 16%; z-index: 5; display: flex; align-items: center; justify-content: center; }
.dspec svg { width: 80%; height: 80%; }

.grille { display: grid; grid-template-columns: max-content repeat(var(--nc, 1), var(--cw, 82px)); gap: 5px 6px; align-items: stretch; justify-content: start; width: max-content; max-width: 100%; }
.gl { text-transform: uppercase; font-size: 17px; display: flex; align-items: center; padding-left: 4px; line-height: 1.1; }
.gc { min-height: 40px; border: 2px solid var(--blanc); border-radius: 8px; background: var(--rouge); color: var(--blanc); font: 700 21px var(--police); display: flex; align-items: center; justify-content: center; padding: 2px 4px; text-align: center; width: 100%; }
.gc.fait { background: var(--noir); }
.gc.calc { background: var(--noir); border-style: dashed; border-color: #9a9a9a; }
.gc.entete { background: var(--noir); font-size: 24px; line-height: 1; padding: 2px 0; }
.gc.entete.actif { background: var(--blanc); color: var(--noir); }
.gc.bloque { opacity: 0.4; }
.gc.vue { cursor: default; }
.grille.bataille .gc { min-height: 48px; border-color: var(--blanc); }
.grille.bataille .gl { font-size: 18px; }
.grille.standard { --cw: 56px; }
.grille.standard .gl { font-size: 19px; }

.corps { flex: 1; min-height: 0; overflow: auto; padding: 12px 4px; display: flex; flex-direction: column; gap: 12px; }
.corps h2 { font-size: 26px; margin: 0; }
.btn { background: var(--noir); border: 3px solid var(--blanc); border-radius: 12px; padding: 12px 18px; min-height: 58px; }
.btn:active { background: var(--blanc); color: var(--noir); }
.reglage { width: 100%; text-align: left; }
.bas { padding: 10px 4px 8px; }
.ok { width: 100%; }
.liste { display: flex; flex-direction: column; gap: 8px; font-size: 20px; }
.liste > div { padding: 4px 8px; border-radius: 8px; }
.gagnant { font-size: clamp(28px, 7vw, 42px); text-align: center; text-transform: uppercase; padding: 20px 8px; line-height: 1.15; border-radius: 10px; }
.info-fin { font-size: 20px; text-align: center; padding: 6px 8px; border-radius: 8px; }

@media all {
  .jeu { flex-direction: row-reverse; align-items: stretch; gap: 14px; }
  .dessus { flex: 1 1 0; min-width: 0; justify-content: center; }
  .grille-box { flex: 0 0 auto; max-width: 68%; }
  .ico { width: 64px; height: 64px; }
}
@media (max-width: 559px), (orientation: landscape) {
  .grille { --cw: 52px; gap: 4px; grid-template-columns: 66px repeat(var(--nc, 1), var(--cw)); }
  .gc { font-size: 16px; min-height: 36px; }
  .gl { font-size: 12px; line-height: 1.05; overflow-wrap: anywhere; }
  .gc.entete { font-size: 20px; }
  .grille.standard { --cw: 40px; grid-template-columns: 112px repeat(var(--nc, 1), var(--cw)); }
  .grille.standard .gl { font-size: 14px; }
  .grille.standard .gc { font-size: 15px; }
  .grille.bataille { --cw: 64px; grid-template-columns: 104px repeat(var(--nc, 1), var(--cw)); }
  .grille.bataille .gl { font-size: 14px; }
  .grille.bataille .gc { font-size: 18px; }
  .ico { width: 52px; height: 52px; }
  .rail { padding: 0; gap: 6px 8px; }
}
/* Paysage : on garde la mise en page du portrait (écran étroit), réduite pour tenir en hauteur et centrée, avec du noir de chaque côté. */
@media (orientation: landscape) {
  html, body { overflow: hidden; }
  body { padding: 0; }
  .ecran { position: absolute; left: 50%; top: 0; width: 380px; height: 820px; max-width: none; margin: 0; transform-origin: top center; transform: translateX(-50%) scale(var(--ech, 1)); }
}
@media (prefers-reduced-motion: reduce) {
  .de { transition: none; }
  .de.joker { animation: none; box-shadow: 0 0 0 5px #fff, 0 0 16px 6px #fff; }
}

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const rnd = (n) => Math.floor(Math.random() * n);
  const RAPIDE = !!window.__rapide;
  const reduit = RAPIDE || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  /* Chaque élément garde son propre écouteur : c'est ce qui permet au bouton OK du SensePlayer de l'activer. */
  function surClic(el, fn) { el.addEventListener('click', fn); }
  const attendre = (ms) => (RAPIDE ? Promise.resolve() : new Promise(function (r) { setTimeout(r, ms); }));

  /* =====================================================================
     SONS (synthèse Web Audio)
     ===================================================================== */
  let AC = null, master = null, noiseBuf = null, fxIn = null;
  const suivis = [];
  function ac() {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      AC = new C();
      const comp = AC.createDynamicsCompressor();
      master = AC.createGain();
      master.gain.value = 0.9;
      master.connect(comp);
      comp.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      if (natif()) {
        ['createGain', 'createBiquadFilter', 'createStereoPanner', 'createOscillator', 'createBufferSource'].forEach(function (k) {
          if (!AC[k]) return;
          const f = AC[k].bind(AC);
          AC[k] = function () { const n = f.apply(null, arguments); suivis.push(n); return n; };
        });
      }
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (AC.createConvolver && !natif()) {
        const conv = AC.createConvolver();
        const len = Math.floor(AC.sampleRate * (natif() ? 0.8 : 1.5));
        const ir = AC.createBuffer(2, len, AC.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const c2 = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) c2[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        }
        conv.buffer = ir;
        fxIn = AC.createGain();
        const wet = AC.createGain();
        wet.gain.value = 0.3;
        fxIn.connect(conv); conv.connect(wet); wet.connect(master);
      }
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function jouer(fn, arg) {
    if (RAPIDE) return;
    try {
      ac();
      if (AC.state === 'suspended') { AC.resume().then(function () { jouer(fn, arg); }).catch(function () { }); return; }
      const d0 = suivis.length;
      fn(arg);
      if (suivis.length > d0) {
        const lot = suivis.splice(d0);
        setTimeout(function () { lot.forEach(function (n) { try { n.disconnect(); } catch (e) { /* rien */ } }); }, 12000);
      }
    } catch (e) { /* son indisponible */ }
  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function sendFx(node, amount) {
    if (!fxIn) return;
    const s = AC.createGain();
    s.gain.value = amount;
    node.connect(s); s.connect(fxIn);
  }
  function noiseHit(t, f, q, peak, dur) {
    const s = AC.createBufferSource();
    s.buffer = noiseBuf;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const g = AC.createGain();
    env(g, t, 0.002, peak, dur);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5, dur + 0.02);
  }
  function tone(t, f0, f1, type, peak, dur, a, wet) {
    const o = AC.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain();
    env(g, t, a || 0.005, peak, dur);
    o.connect(g); g.connect(master);
    if (wet) sendFx(g, wet);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function toc(t, f0, f1, peak, dur) { tone(t, f0, f1, 'sine', peak, dur, 0.003); }
  function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function sortie(pan, dest) {
    dest = dest || master;
    if (AC.createStereoPanner) {
      const p = AC.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      p.connect(dest);
      return p;
    }
    return dest;
  }
  function impact(t, a, pan, brillance) {
    const out = sortie(pan);
    const s = AC.createBufferSource();
    s.buffer = noiseBuf;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = (1500 + Math.random() * 2500) * brillance;
    bp.Q.value = 0.9;
    const g = AC.createGain();
    env(g, t, 0.0015, a, 0.02 + Math.random() * 0.02);
    s.connect(bp); bp.connect(g); g.connect(out);
    s.start(t, Math.random() * 0.5, 0.06);
    const o = AC.createOscillator();
    o.type = 'sine';
    const f = (320 + Math.random() * 500) * (brillance > 1.2 ? 1.6 : 1);
    o.frequency.setValueAtTime(f, t);

     ===================================================================== */
  const NB_DES = 5;
  const CH = 6, MAXI = 7, MINI = 8, BR = 9, CA = 10, FU = 11, PS = 12, GS = 13, YA = 14, PA = 15, DP = 16;
  const LIB = ['Les 1', 'Les 2', 'Les 3', 'Les 4', 'Les 5', 'Les 6', 'Chance', 'Maxi', 'Mini', 'Brelan', 'Carré', 'Full', 'Petite suite', 'Grande suite', 'Yam', '1 paire', '2 paires'];
  const PARLE = ['Les un', 'Les deux', 'Les trois', 'Les quatre', 'Les cinq', 'Les six', 'Chance', 'Maxi', 'Mini', 'Brelan', 'Carré', 'Full', 'Petite suite', 'Grande suite', 'Yam', 'Une paire', 'Deux paires'];
  /* Points moyens qu'une case rapporte quand on la remplit bien : sert aux robots à ne pas gaspiller. */
  const MOYENNES = [2.1, 5.3, 8.6, 12.1, 15.7, 19.2, 22.0, 22.0, 20.0, 21.7, 13.1, 22.6, 29.5, 32.7, 16.9, 10.0, 14.0];
  const COLS = ['Libre', 'Montante', 'Descendante'];
  const PROB_JOKER = 0.05;

  const comptesDe = (vals) => { const c = [0, 0, 0, 0, 0, 0, 0]; vals.forEach(function (v) { c[v]++; }); return c; };
  const somme = (c) => { let s = 0; for (let v = 1; v <= 6; v++) s += v * c[v]; return s; };
  const plusGros = (c) => { let m = 0; for (let v = 1; v <= 6; v++) if (c[v] > m) m = c[v]; return m; };
  const estYam = (c) => plusGros(c) === 5;
  function scoreC(k, c) {
    const max = plusGros(c), s = somme(c);
    if (k < 6) return (k + 1) * c[k + 1];
    switch (k) {
      case BR: return max >= 3 ? s : 0;
      case CA: return max >= 4 ? s : 0;
      case FU: return (c.indexOf(3) > 0 && c.indexOf(2) > 0) ? 25 : 0;
      case PS: return ((c[1] && c[2] && c[3] && c[4]) || (c[2] && c[3] && c[4] && c[5]) || (c[3] && c[4] && c[5] && c[6])) ? 30 : 0;
      case GS: return ((c[1] && c[2] && c[3] && c[4] && c[5]) || (c[2] && c[3] && c[4] && c[5] && c[6])) ? 40 : 0;
      case YA: return max === 5 ? 50 : 0;
      case PA: { for (let v = 6; v >= 1; v--) if (c[v] >= 2) return 2 * v; return 0; }
      case DP: { const f = []; for (let v = 6; v >= 1; v--) { if (c[v] >= 4) f.push(v, v); else if (c[v] >= 2) f.push(v); } return f.length >= 2 ? 2 * (f[0] + f[1]) : 0; }
      default: return s; /* chance, maxi, mini : somme des dés */
    }
  }
  /* Valeur utilisée par les robots : le mini est meilleur quand la somme est petite. */
  const valR = (k, c) => (k === MINI ? 30 - somme(c) : scoreC(k, c));

  function descr(vals) {
    const c = comptesDe(vals);
    let max = 0, face = 0, paires = 0, fp = 0;
    for (let v = 1; v <= 6; v++) { if (c[v] >= max) { max = c[v]; face = v; } if (c[v] === 2) { paires++; fp = v; } }
    if (max === 5) return 'Yam de ' + face;
    if (scoreC(GS, c)) return 'Grande suite';
    if (scoreC(PS, c)) return 'Petite suite';
    if (scoreC(FU, c)) return 'Full';
    if (max === 4) return 'Carré de ' + face;
    if (max === 3) return 'Brelan de ' + face;
    if (paires === 2) return 'Double paire';
    if (paires === 1) return 'Paire de ' + fp;
    return 'Aucune figure';
  }

  /* ---------- Structure d'une fiche ---------- */
  const colonnes = () => (P.mode === 'standard' ? COLS : ['']);
  const idsCases = () => (P.mode === 'standard' ? [0, 1, 2, 3, 4, 5, 7, 8, 6, 15, 16, 9, 10, 11, 12, 13, 14] : [0, 1, 2, 3, 4, 5, 6, 9, 10, 11, 12, 13, 14]);
  const nbCasesTotal = () => idsCases().length * colonnes().length;
  function nouvelleFiche() {
    return {
      cols: colonnes().map(function () { return { v: new Array(17).fill(null), bonus: 0 }; }),
      pv: P.pv, cd: new Array(17).fill(4), elim: false
    };
  }
  /* La case k de la colonne c peut-elle être jouée maintenant ? */
  function jouable(F, c, k) {
    if (P.mode === 'bataille') return !F.elim && F.cd[k] >= 4;
    const v = F.cols[c].v;
    if (v[k] !== null) return false;
    if (P.mode === 'standard' && c > 0) {
      const reste = idsCases().filter(function (x) { return v[x] === null; });
      return c === 1 ? k === reste[reste.length - 1] : k === reste[0];
    }
    return true;
  }
  const premiereCase = (F, c) => { const l = idsCases().filter(function (k) { return jouable(F, c, k); }); return l.length ? l[0] : null; };
  const colonneOuverte = (F, c) => premiereCase(F, c) !== null;
  /* Un yam peut compter pour une case du bas quand le yam est déjà marqué dans la colonne. */
  const yamJoker = (F, c, cc) => P.mode !== 'bataille' && estYam(cc) && F.cols[c].v[YA] === 50;
  function scoreCase(F, c, k, vals) {
    const cc = comptesDe(vals);
    if (k >= CH && yamJoker(F, c, cc)) { if (k === FU) return 25; if (k === PS) return 30; if (k === GS) return 40; }
    return scoreC(k, cc);
  }
  function calcCol(F, c) {
    const v = F.cols[c].v;
    let haut = 0, bas = 0;
    for (let k = 0; k < 6; k++) if (v[k] !== null) haut += v[k];
    [CH, PA, DP, BR, CA, FU, PS, GS, YA].forEach(function (k) { if (v[k] !== null) bas += v[k]; });
    const diff = (v[MAXI] !== null && v[MINI] !== null) ? v[MAXI] - v[MINI] : null;
    const bonus = F.cols[c].bonus * 100;
    const p35 = haut >= 63 ? 35 : 0, p100 = haut >= 84 ? 100 : 0;
    const hautTot = haut + p35 + p100;
    const basTot = bas + (diff || 0) + bonus;
    return { haut: haut, p35: p35, p100: p100, hautTot: hautTot, diff: diff, bonus: bonus, bas: basTot, total: hautTot + basTot };
  }
  function scoreFiche(F) {
    if (P.mode === 'bataille') return F.pv;
    let t = 0;
    for (let c = 0; c < F.cols.length; c++) t += calcCol(F, c).total;
    return t;
  }

  /* =====================================================================
     ROBOTS
     Débutant : garde les dés les plus fréquents, se trompe souvent. Initié : même idée, mais il évite de gaspiller
     les bonnes cases. Pro : calcule le meilleur choix en tenant compte des lancers restants. Expert : comme Pro,
     et il vise aussi les primes du haut.
     ===================================================================== */
  function contexte(niveau, F) {
    const set = {};
    for (let c = 0; c < F.cols.length; c++) idsCases().forEach(function (k) { if (jouable(F, c, k)) set[k] = true; });
    const dispo = Object.keys(set).map(Number);
    let kb = 0;
    if (niveau === 'Expert' && P.mode !== 'bataille' && F.cols.length === 1) {
      const t = calcCol(F, 0);
      if (t.haut < 63) {
        let maxi = t.haut;
        for (let k = 0; k < 6; k++) if (F.cols[0].v[k] === null) maxi += 5 * (k + 1);
        if (maxi >= 63) kb = 2;
      }
    }
    const bat = P.mode === 'bataille';
    return {
      dispo: dispo,
      adj: function (k, s) { return (s - MOYENNES[k] + (k < 6 ? kb * (s - 3 * (k + 1)) : 0)) * (bat && k === CH ? 0.35 : 1); },
      memo: [new Map(), new Map(), new Map()]
    };
  }
  const cle = (c) => c[1] + 6 * c[2] + 36 * c[3] + 216 * c[4] + 1296 * c[5] + 7776 * c[6];
  const SORTIES = {};
  function sorties(k) {
    if (SORTIES[k]) return SORTIES[k];
    const fact = [1, 1, 2, 6, 24, 120], res = [];
    (function rec(f, reste, c) {
      if (f === 6) {
        c[6] = reste;
        let p = fact[k];
        for (let v = 1; v <= 6; v++) p /= fact[c[v]];
        res.push({ c: c.slice(), p: p / Math.pow(6, k) });
        return;
      }
      for (let n = 0; n <= reste; n++) { c[f] = n; rec(f + 1, reste - n, c); }
      c[f] = 0;
    })(1, k, [0, 0, 0, 0, 0, 0, 0]);
    SORTIES[k] = res;
    return res;
  }
  function tenues(c, f, cur, fn) {
    if (f > 6) { fn(cur); return; }
    for (let n = 0; n <= c[f]; n++) { cur[f] = n; tenues(c, f + 1, cur, fn); }
    cur[f] = 0;
  }
  function VR(r, c, ctx) {
    const key = cle(c), memo = ctx.memo[r];
    if (memo.has(key)) return memo.get(key);
    let fin = -1e9;
    ctx.dispo.forEach(function (k) { const a = ctx.adj(k, valR(k, c)); if (a > fin) fin = a; });
    let val = fin;
    if (r > 0) { const m = meilleureTenue(r, c, ctx).val; if (m > val) val = m; }
    memo.set(key, val);
    return val;
  }
  function meilleureTenue(r, c, ctx) {
    let best = -1e9, bestH = null, bestN = -1;
    tenues(c, 1, [0, 0, 0, 0, 0, 0, 0], function (h) {
      let n = 0;
      for (let v = 1; v <= 6; v++) n += h[v];
      const k = 5 - n;
      let val = 0;
      if (k === 0) { val = VR(0, h, ctx); }
      else {
        const outs = sorties(k);
        for (let a = 0; a < outs.length; a++) {
          const o = outs[a];
          val += o.p * VR(r - 1, [0, h[1] + o.c[1], h[2] + o.c[2], h[3] + o.c[3], h[4] + o.c[4], h[5] + o.c[5], h[6] + o.c[6]], ctx);
        }
      }
      if (val > best + 1e-9 || (Math.abs(val - best) <= 1e-9 && n > bestN)) { best = val; bestH = h.slice(); bestN = n; }
    });
    return { val: best, h: bestH };
  }
  /* Transforme « garder 2 dés de valeur 3 » en une liste de dés, en préférant ceux déjà gardés. */
  function desPourTenue(vals, h, deja) {
    const reste = h.slice(), res = [false, false, false, false, false];
    [true, false].forEach(function (pass) {
      vals.forEach(function (v, i) {
        if (!res[i] && reste[v] > 0 && (!pass || deja[i])) { res[i] = true; reste[v]--; }
      });
    });
    return res;
  }
  const plusFrequent = (c) => { let b = 1; for (let v = 1; v <= 6; v++) if (c[v] >= c[b]) b = v; return b; };
  const aucun = () => [false, false, false, false, false];
  /* Rend la liste des dés à garder, ou null pour s'arrêter là. */
  function decider(niveau, vals, restants, F, ctx, deja) {
    const c = comptesDe(vals);
    const libre = (k) => ctx.dispo.indexOf(k) >= 0;
    if (niveau === 'Pro' || niveau === 'Expert') {
      const arret = VR(0, c, ctx);
      const mt = meilleureTenue(restants, c, ctx);
      if (arret >= mt.val - 1e-9) return null;
      return desPourTenue(vals, mt.h, deja);
    }
    if (niveau === 'Débutant') {
      if (Math.random() < 0.4) return vals.map(function () { return Math.random() < 0.5; });
      if ((libre(YA) && scoreC(YA, c)) || (libre(GS) && scoreC(GS, c)) || (libre(FU) && scoreC(FU, c))) return null;
      const v = plusFrequent(c);
      return c[v] >= 2 ? vals.map(function (x) { return x === v; }) : aucun();
    }
    /* Initié */
    if ((libre(YA) && scoreC(YA, c)) || (libre(GS) && scoreC(GS, c)) || (libre(PS) && scoreC(PS, c)) || (libre(FU) && scoreC(FU, c))) return null;
    if (libre(PS) || libre(GS)) {
      for (let s = 1; s <= 3; s++) {
        if (c[s] && c[s + 1] && c[s + 2] && c[s + 3]) {
          const vus = {};
          return vals.map(function (x) { if (x >= s && x <= s + 3 && !vus[x]) { vus[x] = true; return true; } return false; });
        }
      }
    }
    const v = plusFrequent(c);
    if (c[v] >= 2) return vals.map(function (x) { return x === v; });
    const haut = Math.max.apply(null, vals);
    if (haut < 5) return aucun();
    let pris = false;
    return vals.map(function (x) { if (!pris && x === haut) { pris = true; return true; } return false; });
  }
  /* Choisit la case (et la colonne) : rend { c, k } ou null. */
  function choixRobot(niveau, vals, F, ctx) {
    const cands = [];
    for (let c = 0; c < F.cols.length; c++) {
      idsCases().forEach(function (k) {
        if (!jouable(F, c, k)) return;
        const s = scoreCase(F, c, k, vals);
        const sr = k === MINI ? 30 - s : s;
        let v = niveau === 'Débutant' ? sr - k * 0.001 : ctx.adj(k, sr);
        if (c > 0) v += 0.0001;
        cands.push({ c: c, k: k, v: v });
      });
    }
    if (!cands.length) return null;
    if (niveau === 'Débutant' && Math.random() < 0.3) return cands[rnd(cands.length)];
    let best = cands[0];
    cands.forEach(function (x) { if (x.v > best.v) best = x; });
    return best;
  }
  /* Partie solitaire d'un robot en mode rapide (sert aux mesures de force). */
  function joueSolo(niveau) {
    const F = nouvelleFiche();
    for (let t = 0; t < nbCasesTotal(); t++) {
      const ctx = contexte(niveau, F);
      let vals = [0, 0, 0, 0, 0].map(function () { return 1 + rnd(6); });
      let tenus = aucun(), l = 1;
      while (l < 3) {
        const h = decider(niveau, vals, 3 - l, F, ctx, tenus);
        if (!h || h.every(Boolean)) break;
        vals = vals.map(function (v, i) { return h[i] ? v : 1 + rnd(6); });
        tenus = h; l++;
      }
      const ch = choixRobot(niveau, vals, F, ctx);
      const s = scoreCase(F, ch.c, ch.k, vals);
      if (estYam(comptesDe(vals)) && F.cols[ch.c].v[YA] === 50) F.cols[ch.c].bonus++;
      F.cols[ch.c].v[ch.k] = s;
    }
    return scoreFiche(F);
  }

  /* =====================================================================
     ÉTAT DE LA PARTIE
     ===================================================================== */
  const G = { cur: 0, tour: 1, lancers: 0, fiches: [], enCours: false, busy: false, token: 0, voir: 0, col: 0, cible: null };
  const erreur = function (e) { if (window.console) console.error(e); };
  const vivant = (tk) => tk === G.token;
  const estHumain = (i) => P.joueurs[i].type === 'humain';
  const tourHumain = () => G.enCours && !G.busy && estHumain(G.cur) && !$('v-partie').hidden;
  let silence = false;
  function focusSilencieux(el) { silence = true; try { el.focus(); } finally { silence = false; } }
  /* Va sur un élément : avec lecteur d'écran, on annonce avant puis on déplace ; sinon on lit l'élément nous-mêmes. */
  async function allerA(el, texte) {
    if (!el) return;
    if (lecteur()) { if (texte) await dire(texte); focusSilencieux(el); }
    else { focusSilencieux(el); dire((texte ? texte + '. ' : '') + (el.getAttribute('data-parle') || el.textContent.trim())); }
  }
  function msg(t) { $('message').textContent = t; }
  function feedback(texte) { msg(texte); dire(texte); }

  /* ---------- Barre des scores (en haut) ---------- */
  function reconstruireScores() {
    const box = $('scores');
    box.innerHTML = '';
    box.className = 'scores' + (P.mode === 'bataille' ? ' bat' : '');
    for (let i = 0; i < P.nb; i++) {
      const d = document.createElement('div');
      d.className = 'nav ligne-score';
      d.id = 'sc-' + i;
      d.tabIndex = 0;
      d.setAttribute('role', 'group');
      const a = document.createElement('span'), b = document.createElement('span');
      a.className = 'sn'; b.className = 'ss';
      d.appendChild(a); d.appendChild(b);
      surClic(d, function () { clicScore(i); });
      box.appendChild(d);
    }
    majScores();
  }
  function majScores() {
    box_cible();
    for (let i = 0; i < P.nb; i++) {
      const d = $('sc-' + i), F = G.fiches[i];
      if (!d) continue;
      const t = F ? scoreFiche(F) : 0, bat = P.mode === 'bataille';
      d.children[0].textContent = bat ? nom(i) : nom(i) + ' :';
      d.children[1].textContent = bat ? String(t) : ' ' + t + ' pts';
      d.classList.toggle('elim', !!(F && F.elim));
      d.classList.toggle('actif', i === G.cur);
      lab(d, F && F.elim ? nom(i) + ', éliminé' : nom(i) + ', ' + pts(t));
    }
  }
  function box_cible() { $('scores').classList.toggle('cible', !!G.cible); }
  function clicScore(i) {
    if (G.cible) {
      const F = G.fiches[i];
      if (i === G.cible.source || F.elim) { dire(F.elim ? nom(i) + ' est éliminé.' : 'Choisissez un autre joueur.'); return; }
      const r = G.cible.resolve; G.cible = null; box_cible(); r(i);
      return;
    }
    if (!G.enCours || $('v-partie').hidden) return;
    voirFiche(i);
  }

  /* ---------- Dés et piste ---------- */
  const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  const zone = $('zone');
  const dice = [];
  let sz = 40;
  function dessiner(d, v) {
    const c = [24, 50, 76];
    let h = '<svg viewBox="0 0 100 100" aria-hidden="true">';
    PIPS[v].forEach(function (k) {
      h += '<circle cx="' + c[(k - 1) % 3] + '" cy="' + c[Math.floor((k - 1) / 3)] + '" r="11" fill="#fff"/>';
    });
    d.el.innerHTML = h + '</svg>';
  }
  const texteDe = (d) => (d.joker ? 'Joker, ' + d.v : String(d.v) + (d.held ? ', gardé' : ''));
  function majDe(i) { lab(dice[i].el, texteDe(dice[i])); }
  function mesurer() {
    const W = zone.clientWidth, H = zone.clientHeight;
    sz = Math.max(12, Math.min(W * 0.88 / 5 * 0.9, 90));
    zone.style.setProperty('--sz', sz + 'px');
  }
  function pointDansPiste(W, H) {
    const rx = Math.max(0, W / 2 - sz * 0.75), ry = Math.max(0, H / 2 - sz * 0.75);
    const a = Math.random() * 2 * Math.PI, r = Math.sqrt(Math.random());
    return [W / 2 + rx * r * Math.cos(a) - sz / 2, H / 2 + ry * r * Math.sin(a) - sz / 2];
  }
  function poserXY(d, x, y, r) { d.el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + r + 'deg)'; }
  function aligner1(i) {
    const W = zone.clientWidth, rowW = W * 0.88, slot = rowW / 5;
    poserXY(dice[i], (W - rowW) / 2 + i * slot + (slot - sz) / 2, (zone.clientHeight - sz) / 2, 0);
  }
  function disposer() {
    mesurer();
    dice.forEach(function (d, i) { d.el.style.transitionDuration = '0s'; aligner1(i); });
  }
  for (let i = 0; i < NB_DES; i++) {
    const el = document.createElement('div');
    el.tabIndex = 0;
    el.className = 'de nav off';
    zone.appendChild(el);
    dice.push({ el: el, v: 1, held: false, joker: false });
    surClic(el, function () { actionDe(i); });
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { if (!G.busy && zone.clientWidth) disposer(); }).observe(zone);
  }
  const valeurs = () => dice.map(function (d) { return d.v; });
  const listeVoix = (idx) => dice.filter(function (_, i) { return !idx || idx[i]; }).map(function (d) { return d.joker ? 'joker ' + d.v : d.v; }).join(', ');
  function reinitDes() {
    dice.forEach(function (d) { d.held = false; d.joker = false; d.el.classList.remove('kept', 'joker'); d.el.classList.add('off'); });
  }
  function majInfoLancers() {
    const e = $('info-lancers');
    e.textContent = G.lancers === 0 ? '' : (G.lancers >= 3 ? 'Dernier lancer' : 'Lancer ' + G.lancers);
    lab(e, G.lancers === 0 ? 'Pas encore lancé' : (G.lancers >= 3 ? 'Dernier lancer' : 'Lancer ' + G.lancers));
  }

  /* Lance les dés qui ne sont pas gardés (animation, puis dés alignés). Rend vrai si un joker est apparu. */
  async function lancerDes(tk) {
    G.busy = true;
    msg('');
    const idx = [];
    dice.forEach(function (d, i) { if (!d.held) idx.push(i); });
    G.dernier = dice.map(function (_, i) { return idx.indexOf(i) >= 0; });
    jouer(sonLancer, idx.length);
    const W = zone.clientWidth, H = zone.clientHeight;
    const nouveaux = [];
    idx.forEach(function (i) {
      const d = dice[i];
      d.v = 1 + rnd(6);
      d.el.classList.remove('off', 'kept');
      if (P.joker && Math.random() < PROB_JOKER) { d.joker = true; d.held = true; nouveaux.push(i); }
    });
    if (reduit) {
      idx.forEach(function (i) { dice[i].el.style.transitionDuration = '0s'; aligner1(i); dessiner(dice[i], dice[i].v); });
      await attendre(150);
    } else {
      const bas = window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
      idx.forEach(function (i) {
        const d = dice[i];
        d.el.style.transitionDuration = '0s';
        poserXY(d, bas ? W * 0.12 : -sz, bas ? H : (H - sz) / 2, 0);
        dessiner(d, 1 + rnd(6));
      });
      void zone.offsetWidth;
      await attendre(30);
      for (let n = 1; n <= 4; n++) {
        idx.forEach(function (i) {
          const d = dice[i];
          d.el.style.transitionDuration = '0.17s';
          const pt = pointDansPiste(W, H);
          poserXY(d, pt[0], pt[1], Math.random() * 700 - 350);
          dessiner(d, n < 4 ? 1 + rnd(6) : d.v);
        });
        await attendre(n < 4 ? 180 : 450);
        if (!vivant(tk)) return false;
      }
      idx.forEach(function (i) { dice[i].el.style.transitionDuration = '0.4s'; aligner1(i); });
      await attendre(450);
    }
    if (!vivant(tk)) return false;
    idx.forEach(function (i) { dessiner(dice[i], dice[i].v); });

  /* ---------- Tour d'un robot ---------- */
  function ajusterJokers(niveau, ctx) {
    const J = [];

        return;

  async function tourRobot(tk) {

  document.addEventListener('keydown', function (e) {

    if (act && act.tagName === 'INPUT' && e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;

      return;
    }
    const items = navItems();
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (!items.length) return;

      else if (i >= items.length - 1) { jouer(sonButee); items[i].focus(); }

  function raccourci(nomR) {
    const vue = function (v) { return !$('v-' + v).hidden; };
    if (nomR === 'lancer') { if (vue('partie')) $('gobelet').click(); }
    else if (nomR === 'valider') { if (vue('partie')) $('valider').click(); }
    else if (nomR === 'params') {
      if (vue('reglages')) $('ok-reglages').click();
      else if (vue('accueil') || vue('partie')) $('engrenage').click();
    }
  }

  /* ---------- Manette de jeu (Bluetooth ou USB) ----------
     Croix directionnelle ou joystick gauche = flèches. Boutons selon leur position (Retroid Pocket 5) : droite (A) = OK, bas (B) = retour sur Lancer (ou sur la fiche), haut (X) = STOP, gauche (Y) = paramètres. Si l'appareil envoie déjà ces actions
     comme des touches du clavier, la manette n'ajoute rien (pas de double déplacement). */
  let touchePhys = 0;
  document.addEventListener('keydown', function (e) { if (e.isTrusted) touchePhys = Date.now(); }, true);
  const memManette = {};
  let boucleManette = false;
  function envoyerTouche(key) {
    const t0 = Date.now();
    setTimeout(function () {
      if (touchePhys >= t0 - 40) return;
      document.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true }));
    }, 80);
  }
  function lireManettes() {
    const liste = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let g = 0; g < liste.length; g++) {
      const gp = liste[g];

      const ax = gp.axes || [];
      const etat = {
        ArrowUp: b(12) || ax[1] < -0.6, ArrowDown: b(13) || ax[1] > 0.6,
        ArrowLeft: b(14) || ax[0] < -0.6, ArrowRight: b(15) || ax[0] > 0.6,
        Enter: b(1), Lancer: b(0), Stop: b(3), Params: b(2)
      };
      const mem = memManette[gp.index] || (memManette[gp.index] = {});
      Object.keys(etat).forEach(function (k) {
        if (etat[k] && !mem[k]) {
          if (k === 'Lancer') { const gob = $('gobelet'); if (gob.getClientRects().length) { gob.focus(); gob.click(); } }
          else if (k === 'Stop') raccourci('valider');
          else if (k === 'Params') { if (vue('partie')) yGrille(); else raccourci('params'); }
          else envoyerTouche(k);
        }
        mem[k] = etat[k];
      });
    }
    requestAnimationFrame(lireManettes);
  }

  window.addEventListener('gamepadconnected', demarrerManette);

  /* ---------- Démarrage ---------- */
  let double = null;
  function placerDouble() {
    if (!double) return;
    const r = $('gobelet').getBoundingClientRect();
    double.hidden = !(r.width > 0);

    double.style.width = r.width + 'px'; double.style.height = r.height + 'px';
  }
  configurerNormal();
  remiseAZero();
  majReglages();
  echelle();
  majAccueil();
  show('accueil');
  setTimeout(function () { try { annonceAccueil(); } catch (e) { /* rien */ } }, 600);
  try { if (!RAPIDE && natif()) ac(); } catch (e) { /* sans son */ }
  /* Lecteur d'écran : un second « Lancer », placé après STOP et superposé au vrai bouton, permet de passer de STOP à Lancer
     avec la flèche de droite (le lecteur parcourt les éléments dans l'ordre de la page). */
  if (lecteur()) {
    double = document.createElement('button');
    double.type = 'button';
    double.tabIndex = -1;
    double.setAttribute('aria-label', 'Lancer');
    double.style.cssText = 'position:fixed;margin:0;padding:0;border:0;background:transparent;opacity:0;pointer-events:none;';
    double.hidden = true;
    $('valider').after(double);
    surClic(double, function () { actionGobelet(); });
    window.addEventListener('resize', placerDouble);
    if (window.ResizeObserver) new ResizeObserver(placerDouble).observe($('gobelet'));
    Array.prototype.forEach.call(document.querySelectorAll('.nav'), function (el) {
      if (el.tagName !== 'INPUT') el.setAttribute('role', 'group');
    });
    construireGrille(); grilleMode = '';
  }

  if (RAPIDE || window.__test) window.__yam = { reg: reg, P: P, G: G, scoreC: scoreC, scoreCase: scoreCase, calcCol: calcCol, scoreFiche: scoreFiche, jouable: jouable, joueSolo: joueSolo, descr: descr, nom: nom, dice: dice, configurer: configurer, remiseAZero: remiseAZero, demarrer: demarrer, ETAPES: ETAPES, nouvelleFiche: nouvelleFiche, idsCases: idsCases, nbCasesTotal: nbCasesTotal, majGrille: majGrille, lancerTournoi: lancerTournoi, get T() { return T; }, jouerCase: jouerCase, suivant: suivant, SON: SON };
})();
