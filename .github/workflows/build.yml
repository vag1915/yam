name: Fabriquer Yam.apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Créer le projet Android
        run: |
          set -e
          test -f yam.html
          mkdir -p app/src/main/assets app/src/main/java/fr/vanessa/yam
          cp yam.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Yam"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'fr.vanessa.yam'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.vanessa.yam'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:label="Yam"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/fr/vanessa/yam/MainActivity.java <<'EOF'
          package fr.vanessa.yam;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView web;
              private TextToSpeech tts;
              private volatile boolean ttsPret = false;
              private AccessibilityManager am;

              private boolean lecteurActif() {
                  return am != null && am.isEnabled();
              }

              private void immersif() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean focus) {
                  super.onWindowFocusChanged(focus);
                  if (focus) immersif();
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  am = (AccessibilityManager) getSystemService(Context.ACCESSIBILITY_SERVICE);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Pont(), "AndroidTTS");
                  setContentView(web);

                  // La synthese propre a l'application ne sert que s'il n'y a pas de lecteur d'ecran actif.
                  if (!lecteurActif()) {
                      tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                          @Override
                          public void onInit(int status) {
                              if (status == TextToSpeech.SUCCESS) {
                                  int r = tts.setLanguage(Locale.FRANCE);
                                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                                      tts.setLanguage(Locale.FRENCH);
                                  }
                                  ttsPret = true;
                              }
                          }
                      });
                      tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                          @Override public void onStart(String id) { }
                          @Override public void onDone(String id) { fin(id); }
                          @Override public void onError(String id) { fin(id); }
                          @Override public void onStop(String id, boolean interrupted) { fin(id); }
                      });
                  }

                  web.loadUrl("file:///android_asset/index.html");
                  web.requestFocus();
              }

              private void fin(final String id) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (web != null) {
                              web.evaluateJavascript("window.__ttsFin&&window.__ttsFin('" + id + "')", null);
                          }
                      }
                  });
              }

              public class Pont {
                  @JavascriptInterface
                  public boolean pret() {
                      return lecteurActif() || ttsPret;
                  }

                  @JavascriptInterface
                  public boolean lecteur() {
                      return lecteurActif();
                  }

                  @JavascriptInterface
                  public void speak(final String texte, final String id, boolean ajouter) {
                      if (lecteurActif()) {
                          // Annonce confiee au lecteur d'ecran de l'appareil (une seule voix).
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (web != null) {
                                      web.announceForAccessibility(texte);
                                  }
                              }
                          });
                          return;
                      }
                      if (!ttsPret || tts == null) return;
                      tts.speak(texte, ajouter ? TextToSpeech.QUEUE_ADD : TextToSpeech.QUEUE_FLUSH, null, id);
                  }

                  @JavascriptInterface
                  public void stop() {
                      if (ttsPret && tts != null && !lecteurActif()) tts.stop();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Compiler l'application
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier Yam.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Yam.apk
          gh release create "v${{ github.run_number }}" Yam.apk \
            --title "Yam (version ${{ github.run_number }})" \
            --notes "Fichier à installer : Yam.apk"
